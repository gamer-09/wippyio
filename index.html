<body>
  <!-- Noise overlay -->
  <div class="noise-overlay"></div>

  <!-- Cursor trail canvas -->
  <canvas class="cursor-trail" id="cursorTrail"></canvas>

  <!-- Aurora background -->
  <div class="aurora">
    <div class="aurora-1"></div>
    <div class="aurora-2"></div>
    <div class="aurora-3"></div>
    <div class="aurora-4"></div>
  </div>

  <!-- Theme transition overlay -->
  <div class="theme-transition" id="themeTransition"></div>

  <!-- Navigation -->
  <nav class="topnav">
    <a href="/" class="nav-brand">
      <span class="nav-logo">⚡</span>
      <span class="nav-title">wippy</span>
    </a>
    <div class="nav-right">
      <a href="help.html" class="nav-link">Guide</a>
      <a href="https://github.com/gamer-09/storage-packed" target="_blank" class="nav-link">Vault ↗</a>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </nav>

  <!-- Hero -->
  <header class="hero">
    <div class="hero-content">
      <h1 class="hero-title reveal">
        <span class="hero-line hero-accent">Every project</span>
        <span class="hero-line">I've ever built.</span>
      </h1>
      <p class="hero-sub reveal">Curated, organized, ready to explore.</p>

      <!-- Stat counters -->
      <div class="stat-bar reveal">
        <div class="stat-item">
          <span class="stat-num" id="statTotal">0</span>
          <span class="stat-lbl">Projects</span>
        </div>
        <div class="stat-sep"></div>
        <div class="stat-item">
          <span class="stat-num stat-green" id="statCompleted">0</span>
          <span class="stat-lbl">Completed</span>
        </div>
        <div class="stat-sep"></div>
        <div class="stat-item">
          <span class="stat-num stat-amber" id="statProgress">0</span>
          <span class="stat-lbl">In Progress</span>
        </div>
        <div class="stat-sep"></div>
        <div class="stat-item">
          <span class="stat-num stat-purple" id="statLanguages">0</span>
          <span class="stat-lbl">Languages</span>
        </div>
      </div>
    </div>

    <!-- Scroll indicator -->
    <div class="scroll-hint reveal">
      <span>Scroll to explore</span>
      <div class="scroll-arrow">↓</div>
    </div>
  </header>

  <main>
    <!-- Controls bar -->
    <section class="controls reveal">
      <div class="controls-row">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchInput" placeholder="Search projects..." autocomplete="off" />
          <button class="search-clear" id="searchClear" aria-label="Clear search">&times;</button>
        </div>
        <div class="controls-actions">
          <div class="view-toggle">
            <button class="view-btn active" data-view="grid" aria-label="Grid view">⊞</button>
            <button class="view-btn" data-view="list" aria-label="List view">☰</button>
            <button class="view-btn" data-view="timeline" aria-label="Timeline view">⏱</button>
          </div>
          <select class="sort-select" id="sortSelect">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="name">Name A→Z</option>
            <option value="name-desc">Name Z→A</option>
            <option value="size">Largest</option>
            <option value="size-asc">Smallest</option>
          </select>
        </div>
      </div>
      <div class="filter-row">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="completed">✓ Completed</button>
        <button class="filter-btn" data-filter="not-completed">● In Progress</button>
        <span class="filter-count" id="filterCount"></span>
      </div>
    </section>

    <!-- Loading skeleton -->
    <section class="bento-grid skeleton-grid" id="skeletonGrid">
      <div class="skeleton-card sk-large"><div class="sk-line sk-w60 sk-h20"></div><div class="sk-line sk-w100 sk-h12"></div><div class="sk-line sk-w80 sk-h12"></div><div class="sk-line sk-w50 sk-h12"></div></div>
      <div class="skeleton-card"><div class="sk-line sk-w70 sk-h18"></div><div class="sk-line sk-w100 sk-h10"></div><div class="sk-line sk-w60 sk-h10"></div></div>
      <div class="skeleton-card"><div class="sk-line sk-w50 sk-h18"></div><div class="sk-line sk-w90 sk-h10"></div><div class="sk-line sk-w70 sk-h10"></div></div>
      <div class="skeleton-card"><div class="sk-line sk-w80 sk-h18"></div><div class="sk-line sk-w100 sk-h10"></div><div class="sk-line sk-w40 sk-h10"></div></div>
      <div class="skeleton-card sk-wide"><div class="sk-line sk-w40 sk-h20"></div><div class="sk-line sk-w100 sk-h10"></div><div class="sk-line sk-w90 sk-h10"></div></div>
      <div class="skeleton-card"><div class="sk-line sk-w60 sk-h18"></div><div class="sk-line sk-w80 sk-h10"></div><div class="sk-line sk-w50 sk-h10"></div></div>
    </section>

    <!-- Project bento grid -->
    <section class="bento-grid" id="projectGrid" style="display:none;"></section>

    <!-- List view -->
    <section class="list-view" id="projectList" style="display:none;"></section>

    <!-- Timeline view -->
    <section class="timeline-view" id="projectTimeline" style="display:none;"></section>

    <!-- Empty state -->
    <section class="empty-state" id="emptyState" style="display:none;">
      <div class="empty-icon">🔍</div>
      <p class="empty-title" id="emptyTitle">No projects found</p>
      <p class="empty-sub">Try a different search or filter.</p>
    </section>
  </main>

  <!-- Project detail popup -->
  <div class="popup-overlay" id="popupOverlay">
    <div class="popup" id="popup">
      <button class="popup-close" id="popupClose" aria-label="Close">&times;</button>
      <div class="popup-body" id="popupBody"></div>
    </div>
  </div>

  <footer>
    <div class="footer-inner">
      <div class="footer-counter">
        <img src="https://visitor-counter-badge.vercel.app/api/gamer-09/wippyio?label=Visitors&color=ff6b35&labelColor=1a1a2e&style=for-the-badge" alt="Visitor Counter" loading="lazy" />
      </div>
      <p><a href="help.html">📖 Help & Guide</a> · Synced from <a href="https://github.com/gamer-09/storage-packed" target="_blank">storage-packed</a> vault</p>
      <p class="footer-sub">Built with ❤️ and a lot of ☕</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
