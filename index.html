<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Hub — Portfolio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Theme transition overlay -->
  <div class="theme-transition" id="themeTransition"></div>

  <!-- Animated background -->
  <div class="bg-effects">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>
  </div>

  <header>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>

    <div class="header-inner">
      <div class="logo-wrapper">
        <span class="logo-icon">⚡</span>
        <h1 class="logo">Project Hub</h1>
      </div>
      <p class="tagline">Every project I've built, archived, and curated — in one place.</p>

      <!-- Stat counters -->
      <div class="stat-cards" id="statCards">
        <div class="stat-card">
          <span class="stat-number" data-target="0" id="statTotal">0</span>
          <span class="stat-label">Total Projects</span>
        </div>
        <div class="stat-card stat-completed">
          <span class="stat-number" data-target="0" id="statCompleted">0</span>
          <span class="stat-label">Completed</span>
        </div>
        <div class="stat-card stat-progress">
          <span class="stat-number" data-target="0" id="statProgress">0</span>
          <span class="stat-label">In Progress</span>
        </div>
        <div class="stat-card stat-languages">
          <span class="stat-number" data-target="0" id="statLanguages">0</span>
          <span class="stat-label">Languages</span>
        </div>
      </div>
    </div>
  </header>

  <main>
    <!-- Controls bar -->
    <section class="controls">
      <div class="controls-row">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchInput" placeholder="Search projects, languages, file types…" autocomplete="off" />
          <button class="search-clear" id="searchClear" aria-label="Clear search">&times;</button>
        </div>

        <div class="controls-actions">
          <div class="view-toggle">
            <button class="view-btn active" data-view="grid" aria-label="Grid view">
              <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
            </button>
            <button class="view-btn" data-view="list" aria-label="List view">
              <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/></svg>
            </button>
            <button class="view-btn" data-view="timeline" aria-label="Timeline view">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18"><line x1="12" y1="2" x2="12" y2="22"/><circle cx="12" cy="6" r="2.5" fill="currentColor"/><circle cx="12" cy="14" r="2.5" fill="currentColor"/><line x1="14.5" y1="6" x2="20" y2="6"/><line x1="4" y1="14" x2="9.5" y2="14"/></svg>
            </button>
          </div>

          <select class="sort-select" id="sortSelect">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="name">Name A→Z</option>
            <option value="name-desc">Name Z→A</option>
            <option value="size">Largest</option>
            <option value="size-asc">Smallest</option>
          </select>
        </div>
      </div>

      <div class="filter-row">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="completed">
          <span class="filter-dot dot-green"></span>Completed
        </button>
        <button class="filter-btn" data-filter="not-completed">
          <span class="filter-dot dot-amber"></span>In Progress
        </button>
        <span class="filter-count" id="filterCount"></span>
      </div>
    </section>

    <!-- Loading skeleton -->
    <section class="grid skeleton-grid" id="skeletonGrid">
      <div class="skeleton-card"><div class="sk-header"><div class="sk-line sk-w60"></div><div class="sk-badge"></div></div><div class="sk-line sk-w100"></div><div class="sk-line sk-w90"></div><div class="sk-row"><div class="sk-pill"></div><div class="sk-pill"></div><div class="sk-pill"></div></div><div class="sk-footer"><div class="sk-line sk-w30"></div><div class="sk-line sk-w20"></div></div></div>
      <div class="skeleton-card"><div class="sk-header"><div class="sk-line sk-w50"></div><div class="sk-badge"></div></div><div class="sk-line sk-w100"></div><div class="sk-line sk-w80"></div><div class="sk-row"><div class="sk-pill"></div><div class="sk-pill"></div></div><div class="sk-footer"><div class="sk-line sk-w30"></div><div class="sk-line sk-w20"></div></div></div>
      <div class="skeleton-card"><div class="sk-header"><div class="sk-line sk-w70"></div><div class="sk-badge"></div></div><div class="sk-line sk-w100"></div><div class="sk-line sk-w60"></div><div class="sk-row"><div class="sk-pill"></div><div class="sk-pill"></div><div class="sk-pill"></div></div><div class="sk-footer"><div class="sk-line sk-w30"></div><div class="sk-line sk-w20"></div></div></div>
      <div class="skeleton-card"><div class="sk-header"><div class="sk-line sk-w40"></div><div class="sk-badge"></div></div><div class="sk-line sk-w90"></div><div class="sk-line sk-w100"></div><div class="sk-row"><div class="sk-pill"></div><div class="sk-pill"></div></div><div class="sk-footer"><div class="sk-line sk-w30"></div><div class="sk-line sk-w20"></div></div></div>
      <div class="skeleton-card"><div class="sk-header"><div class="sk-line sk-w55"></div><div class="sk-badge"></div></div><div class="sk-line sk-w100"></div><div class="sk-line sk-w70"></div><div class="sk-row"><div class="sk-pill"></div><div class="sk-pill"></div><div class="sk-pill"></div></div><div class="sk-footer"><div class="sk-line sk-w30"></div><div class="sk-line sk-w20"></div></div></div>
      <div class="skeleton-card"><div class="sk-header"><div class="sk-line sk-w65"></div><div class="sk-badge"></div></div><div class="sk-line sk-w80"></div><div class="sk-line sk-w100"></div><div class="sk-row"><div class="sk-pill"></div><div class="sk-pill"></div></div><div class="sk-footer"><div class="sk-line sk-w30"></div><div class="sk-line sk-w20"></div></div></div>
    </section>

    <!-- Project grid -->
    <section class="grid" id="projectGrid" style="display:none;"></section>

    <!-- List view -->
    <section class="list-view" id="projectList" style="display:none;"></section>

    <!-- Timeline view -->
    <section class="timeline-view" id="projectTimeline" style="display:none;"></section>

    <!-- Empty state -->
    <section class="empty-state" id="emptyState" style="display:none;">
      <div class="empty-icon">🔍</div>
      <p class="empty-title" id="emptyTitle">No projects found</p>
      <p class="empty-sub">Try a different search or filter.</p>
    </section>
  </main>

  <!-- Project detail popup -->
  <div class="popup-overlay" id="popupOverlay">
    <div class="popup" id="popup">
      <button class="popup-close" id="popupClose" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div class="popup-body" id="popupBody"></div>
    </div>
  </div>

  <footer>
    <div class="footer-inner">
      <p>Synced from <a href="https://github.com/gamer-09/storage-packed" target="_blank">storage-packed</a> vault</p>
      <p class="footer-sub">Built with ❤️ and a lot of ☕</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
