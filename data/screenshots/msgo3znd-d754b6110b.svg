<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" filter="url(#grain)" opacity="0.3"/>
  <circle cx="520" cy="80" r="120" fill="white" opacity="0.06"/>
  <circle cx="100" cy="340" r="80" fill="white" opacity="0.05"/>
  <text x="320" y="180" text-anchor="middle" font-size="64" fill="white" opacity="0.9">📁</text>
  <text x="320" y="240" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="white" opacity="0.95">ip-tracker</text>
  <text x="320" y="275" text-anchor="middle" font-family="monospace" font-size="16" fill="white" opacity="0.5">IT</text>
</svg>